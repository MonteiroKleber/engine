openapi: 3.0.0
info:
  title: Sistema Demo API
  version: 1.0.0
  description: API gerada automaticamente para Sistema Demo
paths:
  /api/empresas:
    get:
      operationId: listEmpresa
      tags:
      - Empresa
      summary: Listar empresas
      responses:
        '200':
          description: Lista de empresas
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
    post:
      operationId: createEmpresa
      tags:
      - Empresa
      summary: Criar empresa
      responses:
        '201':
          description: Empresa criado
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empresa'
  /api/empresas/{id}:
    get:
      operationId: getEmpresa
      tags:
      - Empresa
      summary: Obter empresa por ID
      responses:
        '200':
          description: Detalhes do empresa
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: updateEmpresa
      tags:
      - Empresa
      summary: Atualizar empresa
      responses:
        '200':
          description: Empresa atualizado
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empresa'
    delete:
      operationId: deleteEmpresa
      tags:
      - Empresa
      summary: Deletar empresa
      responses:
        '200':
          description: Empresa deletado
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
components:
  schemas:
    Empresa:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        cnpj:
          type: string
        endereco:
          type: string
      required:
      - id
      - nome
      - cnpj
