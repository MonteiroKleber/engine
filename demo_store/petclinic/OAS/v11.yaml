openapi: 3.0.0
info:
  title: Sistema Petclinic API
  version: 1.0.0
  description: API gerada automaticamente para Sistema Petclinic
paths:
  /api/roles:
    get:
      operationId: listRole
      tags:
      - Role
      summary: Listar roles
      responses:
        '200':
          description: Lista de roles
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
    post:
      operationId: createRole
      tags:
      - Role
      summary: Criar role
      responses:
        '201':
          description: Role criado
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Role'
  /api/roles/{id}:
    get:
      operationId: getRole
      tags:
      - Role
      summary: Obter role por ID
      responses:
        '200':
          description: Detalhes do role
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: updateRole
      tags:
      - Role
      summary: Atualizar role
      responses:
        '200':
          description: Role atualizado
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Role'
    delete:
      operationId: deleteRole
      tags:
      - Role
      summary: Deletar role
      responses:
        '200':
          description: Role deletado
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
components:
  schemas:
    Role:
      type: object
      properties:
        id:
          type: string
        admin:
          type: string
        vet:
          type: string
        recepcionist:
          type: string
      required:
      - id
      - admin
      - vet
      - recepcionist
