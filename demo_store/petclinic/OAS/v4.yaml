openapi: 3.0.0
info:
  title: Sistema Petclinic API
  version: 1.0.0
  description: API gerada automaticamente para Sistema Petclinic
paths:
  /api/tutors:
    get:
      operationId: listTutor
      tags:
      - Tutor
      summary: Listar tutors
      responses:
        '200':
          description: Lista de tutors
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
    post:
      operationId: createTutor
      tags:
      - Tutor
      summary: Criar tutor
      responses:
        '201':
          description: Tutor criado
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tutor'
  /api/tutors/{id}:
    get:
      operationId: getTutor
      tags:
      - Tutor
      summary: Obter tutor por ID
