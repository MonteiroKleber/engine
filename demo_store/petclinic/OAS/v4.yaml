components:
  schemas:
    Tutor:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        cpf:
          type: string
        telefone:
          type: string
        email:
          type: string
        endereco:
          type: string
      required:
      - id
      - nome
      - cpf
      - email
      - endereco
    Pet:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        especie:
          type: string
        raca:
          type: string
        sexo:
          type: string
        data_nascimento:
          type: string
        peso:
          type: string
        observacoes:
          type: string
        tutor_id:
          type: string
      required:
      - id
      - nome
      - especie
      - raca
      - sexo
      - data_nascimento
      - observacoes
      - tutor_id
    Veterinario:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        crmv:
          type: string
        especialidade:
          type: string
        telefone:
          type: string
        email:
          type: string
      required:
      - id
      - nome
      - crmv
      - especialidade
      - email
    Atendimento:
      type: object
      properties:
        id:
          type: string
        data:
          type: string
        hora:
          type: string
        pet_id:
          type: string
        veterinario_id:
          type: string
        motivo:
          type: string
        anotacoes:
          type: string
        diagnostico:
          type: string
        prescricao:
          type: string
        status:
          type: string
      required:
      - id
      - data
      - hora
      - pet_id
      - veterinario_id
      - motivo
      - anotacoes
      - diagnostico
      - prescricao
      - status
    Vacina:
      type: object
      properties:
        id:
          type: string
        pet_id:
          type: string
        vacina:
          type: string
        data_aplicacao:
          type: string
        proxima_dose:
          type: string
        lote:
          type: string
        observacoes:
          type: string
      required:
      - id
      - pet_id
      - vacina
      - data_aplicacao
      - proxima_dose
      - lote
      - observacoes
    Agendamento:
      type: object
      properties:
        id:
          type: string
        data:
          type: string
        hora:
          type: string
        pet_id:
          type: string
        veterinario_id:
          type: string
        servico:
          type: string
        status:
          type: string
      required:
      - id
      - data
      - hora
      - pet_id
      - servico
      - status
    Pagamento:
      type: object
      properties:
        id:
          type: string
        atendimento_id:
          type: string
        forma_pagamento:
          type: string
        valor:
          type: string
        status:
          type: string
        data:
          type: string
      required:
      - id
      - atendimento_id
      - forma_pagamento
      - valor
      - status
      - data
