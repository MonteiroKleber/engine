openapi: 3.0.0
info:
  title: Sistema Duration_Hotfix_Test API
  version: 1.0.0
  description: API gerada automaticamente para Sistema Duration_Hotfix_Test
paths:
  /api/lojas:
    get:
      operationId: listLoja
      tags:
      - Loja
      summary: Listar lojas
      responses:
        '200':
          description: Lista de lojas
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
    post:
      operationId: createLoja
      tags:
      - Loja
      summary: Criar loja
      responses:
        '201':
          description: Loja criado
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Loja'
  /api/lojas/{id}:
    get:
      operationId: getLoja
      tags:
      - Loja
      summary: Obter loja por ID
      responses:
        '200':
          description: Detalhes do loja
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: updateLoja
      tags:
      - Loja
      summary: Atualizar loja
      responses:
        '200':
          description: Loja atualizado
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Loja'
    delete:
      operationId: deleteLoja
      tags:
      - Loja
      summary: Deletar loja
      responses:
        '200':
          description: Loja deletado
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
components:
  schemas:
    Loja:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        cnpj:
          type: string
      required:
      - id
      - nome
      - cnpj
