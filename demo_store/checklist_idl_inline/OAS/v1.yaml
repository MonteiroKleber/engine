openapi: 3.0.0
info:
  title: Sistema Checklist_Idl_Inline API
  version: 1.0.0
  description: API gerada automaticamente para Sistema Checklist_Idl_Inline
paths:
  /api/items:
    get:
      operationId: listItem
      tags:
      - Item
      summary: Listar items
      responses:
        '200':
          description: Lista de items
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
    post:
      operationId: createItem
      tags:
      - Item
      summary: Criar item
      responses:
        '201':
          description: Item criado
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
  /api/items/{id}:
    get:
      operationId: getItem
      tags:
      - Item
      summary: Obter item por ID
      responses:
        '200':
          description: Detalhes do item
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: updateItem
      tags:
      - Item
      summary: Atualizar item
      responses:
        '200':
          description: Item atualizado
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
    delete:
      operationId: deleteItem
      tags:
      - Item
      summary: Deletar item
      responses:
        '200':
          description: Item deletado
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
components:
  schemas:
    Item:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
