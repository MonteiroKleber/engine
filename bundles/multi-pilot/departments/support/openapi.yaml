openapi: "3.0.0"
info:
  title: Support Department API
  version: "1.0.0"
paths:
  /support/tickets:
    post:
      operationId: createTicket
      summary: Create a support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                description:
                  type: string
              required:
                - subject
      responses:
        "200":
          description: Ticket created
        "202":
          description: Ticket pending approval
