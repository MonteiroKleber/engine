openapi: 3.0.0
info:
  title: Sistema E-Commerce API
  version: 1.0.0
  description: API gerada automaticamente para Sistema E-Commerce
paths:
  /api/produtos:
    get:
      operationId: listProduto
      tags:
      - Produto
      summary: Listar produtos
      responses:
        '200':
          description: Lista de produtos
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
    post:
      operationId: createProduto
      tags:
      - Produto
      summary: Criar produto
      responses:
        '201':
          description: Produto criado
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Produto'
  /api/produtos/{id}:
    get:
      operationId: getProduto
      tags:
      - Produto
      summary: Obter produto por ID
      responses:
        '200':
          description: Detalhes do produto
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: updateProduto
      tags:
      - Produto
      summary: Atualizar produto
      responses:
        '200':
          description: Produto atualizado
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Produto'
    delete:
      operationId: deleteProduto
      tags:
      - Produto
      summary: Deletar produto
      responses:
        '200':
          description: Produto deletado
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/pedidos:
    get:
      operationId: listPedido
      tags:
      - Pedido
      summary: Listar pedidos
      responses:
        '200':
          description: Lista de pedidos
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
    post:
      operationId: createPedido
      tags:
      - Pedido
      summary: Criar pedido
      responses:
        '201':
          description: Pedido criado
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pedido'
  /api/pedidos/{id}:
    get:
      operationId: getPedido
      tags:
      - Pedido
      summary: Obter pedido por ID
      responses:
        '200':
          description: Detalhes do pedido
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: updatePedido
      tags:
      - Pedido
      summary: Atualizar pedido
      responses:
        '200':
          description: Pedido atualizado
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pedido'
    delete:
      operationId: deletePedido
      tags:
      - Pedido
      summary: Deletar pedido
      responses:
        '200':
          description: Pedido deletado
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
components:
  schemas:
    Produto:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        descricao:
          type: string
        preco:
          type: string
      required:
      - id
      - nome
      - preco
    Pedido:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        data:
          type: string
        status:
          type: string
        valor_total:
          type: string
      required:
      - id
      - nome
      - data
      - status
      - valor_total
