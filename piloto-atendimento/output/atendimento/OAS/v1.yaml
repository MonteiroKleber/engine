components:
  schemas:
    Customer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        tier:
          type: string
      required:
      - id
      - name
      - email
      - tier
    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        department:
          type: string
        skills:
          type: string
      required:
      - id
      - name
      - department
      - skills
    Resolution:
      type: object
      properties:
        id:
          type: string
        ticket_id:
          type: string
        agent_id:
          type: string
        resolution_text:
          type: string
        resolved_at:
          type: string
      required:
      - id
      - ticket_id
      - agent_id
      - resolution_text
      - resolved_at
    Assignticket:
      type: object
      properties:
        id:
          type: string
        manager_atribui_ticket_ao_agent:
          type: string
      required:
      - id
      - manager_atribui_ticket_ao_agent
    Resolveticket:
      type: object
      properties:
        id:
          type: string
        agent_resolve_ticket:
          type: string
      required:
      - id
      - agent_resolve_ticket
    Escalateticket:
      type: object
      properties:
        id:
          type: string
        agent_escala_ticket:
          type: string
      required:
      - id
      - agent_escala_ticket
    Listticket:
      type: object
      properties:
        id:
          type: string
        agent_lista_tickets:
          type: string
      required:
      - id
      - agent_lista_tickets
